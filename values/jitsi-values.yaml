publicURL: "https://vidcall3-prod.transmedika.co.id"

enableAuth: true
enableGuests: true

xmpp:
  domain: meet.jitsi
  authDomain: auth.meet.jitsi
  mucDomain: muc.meet.jitsi
  internalMucDomain: internal-muc.meet.jitsi
  guestDomain: guest.meet.jitsi

web:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  httpsEnabled: false
  httpRedirect: false
  nodeSelector:
    kubernetes.io/hostname: srv-deploy-eng
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: vidcall3-prod.transmedika.co.id
        paths:
          - /
    tls:
      - secretName: jitsi-tls
        hosts:
          - vidcall3-prod.transmedika.co.id
  extraEnvs:
    ENABLE_XMPP_WEBSOCKET: "1"
    ENABLE_COLIBRI_WEBSOCKET: "1"

prosody:
  persistence:
    enabled: true
    size: 1Gi
  nodeSelector:
    kubernetes.io/hostname: srv-deploy-eng

jicofo:
  xmpp:
    password: "focuspass"

jvb:
  replicaCount: 1
  UDPPort: 31829
  service:
    enabled: true
    type: LoadBalancer
    loadBalancerIP: 192.168.20.190
    externalTrafficPolicy: Local
    annotations:
      metallb.io/allow-shared-ip: "jitsi-shared"
    nodePort: 31829
    extraPorts:
      - name: colibri-ws
        port: 9090
        targetPort: 9090
        protocol: TCP
  publicIPs:
    - 157.15.164.236
  useNodeIP: false
  stunServers: ""
  useInternalStun: false
  xmpp:
    password: "jvbpass123"
  extraEnvs:
    JVB_ENABLE_APIS: "rest,colibri"
    JVB_ENABLE_COLIBRI_WS: "1"
    JVB_WS_SERVER_ID: "vidcall3-prod.transmedika.co.id"
    JVB_WS_DOMAIN: "vidcall3-prod.transmedika.co.id"
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

websockets:
  colibri:
    enabled: true
  xmpp:
    enabled: true
