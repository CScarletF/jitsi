# cert-manager Helm values
# Chart: jetstack/cert-manager
# Install: helm install cert-manager jetstack/cert-manager \
#            -n cert-manager --create-namespace \
#            -f values/cert-manager-values.yaml

# Install CRDs via Helm so they are tied to the release lifecycle.
# Do NOT also apply CRDs manually — pick one method only.
crds:
  enabled: true

# Single replica is acceptable for this cluster size.
# Increase to 2 if you add a third node later.
replicaCount: 1

# Restrict to the jitsi and cert-manager namespaces.
# Remove this block to allow cert-manager to serve all namespaces (default).
# Kept here for explicitness — current scope is one domain, one namespace.
# clusterResourceNamespace: cert-manager  # default, no change needed

# Resource limits sized for srv-deploy-eng (8GB RAM, 4 vCPU shared).
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

webhook:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

cainjector:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Pin all cert-manager components to srv-deploy-eng.
# Matches node placement strategy for all Jitsi components.
nodeSelector:
  kubernetes.io/hostname: srv-deploy-eng

webhook:
  nodeSelector:
    kubernetes.io/hostname: srv-deploy-eng

cainjector:
  nodeSelector:
    kubernetes.io/hostname: srv-deploy-eng