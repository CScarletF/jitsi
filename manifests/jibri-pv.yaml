# Jibri recordings — NFS-backed PersistentVolume
# NFS server: jenkins (192.168.20.177)
# Export path: /home/jenkins/jitsi-helm/recordings
#
# To migrate to external NAS or Longhorn later:
#   - Update nfs.server and nfs.path (for NAS)
#   - Or replace the nfs block entirely with a Longhorn storageClassName PVC
#   - PVC and Jibri config require no changes
#
# Apply: kubectl apply -f manifests/jibri-pv.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jibri-recordings-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.20.177
    path: /home/jenkins/jitsi-helm/recordings

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jibri-recordings-pvc
  namespace: jitsi
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 20Gi
  volumeName: jibri-recordings-pv